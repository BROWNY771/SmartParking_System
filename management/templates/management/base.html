
{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Smart Parking{% endblock %}</title>
    
    <link rel="stylesheet" href="{% static 'management/css/style.css' %}">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="nav-brand">🅿️ SmartPark System</div>
        <nav class="nav-links">
    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'check_in' %}" style="color: #2ecc71; font-weight: bold;">+ Check-In</a>
    <a href="{% url 'history' %}">History</a>
    <a href="/admin/">Admin</a>
</nav>
        <div class="user-info">
            <span>Welcome, <strong>{{ user.username|default:"Staff" }}</strong></span>
        </div>
    </header>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
