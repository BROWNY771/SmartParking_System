{% extends 'management/base.html' %}

{% block title %}Vehicle Check-in{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
    <h2 style="text-align: center; color: #2c3e50;">🚗 Vehicle Entry</h2>
    <hr style="border: 0; border-top: 1px solid #eee; margin-bottom: 25px;">

    <form method="post">
        {% csrf_token %}
        
        {% for field in form %}
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #555;">{{ field.label }}</label>
                {{ field }}
                <style>.form-input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }</style>
            </div>
        {% endfor %}

        <button type="submit" style="width: 100%; padding: 12px; background: #2ecc71; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px;">
            Confirm Entry
        </button>
        <a href="{% url 'dashboard' %}" style="display: block; text-align: center; margin-top: 15px; color: #95a5a6; text-decoration: none;">Cancel</a>
    </form>
</div>
{% endblock %}
